[project]
name = "agentic-security-auditor"
version = "0.1.0"
description = "An agentic security remediation platform combining deterministic SAST, AI analysis, automated remediation, and validation."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "streamlit",
    "langgraph",
    "anthropic",
    "pydantic",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = [
    "backend/tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
